apiVersion: batch/v1
kind: Job
metadata:
  name: patch-openai-credentials
  labels:
    app.kubernetes.io/name: openai-patch
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: llamastack
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openai-patch
        app.kubernetes.io/component: credentials
    spec:
      serviceAccountName: openai-patch-sa
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-credentials
                  key: api-key
          command:
            - bash
            - -ec
            - |
              echo "=== Patching llama-stack-secret with OpenAI credentials ==="

              echo "Waiting for llama-stack-secret to exist..."
              for i in $(seq 1 60); do
                if oc get secret llama-stack-secret -n llamastack &>/dev/null; then
                  break
                fi
                echo "  attempt $i/60 — secret not found yet, waiting 5s..."
                sleep 5
              done

              oc patch secret llama-stack-secret -n llamastack \
                -p "{\"stringData\":{
                  \"OPENAI_API_KEY\":\"${OPENAI_API_KEY}\",
                  \"VLLM_API_TOKEN\":\"${OPENAI_API_KEY}\",
                  \"VLLM_EMBEDDING_API_TOKEN\":\"${OPENAI_API_KEY}\"
                }}"
              echo "Secret patched."

              echo "Waiting for llamastack deployment to exist..."
              for i in $(seq 1 60); do
                if oc get deployment llamastack -n llamastack &>/dev/null; then
                  break
                fi
                echo "  attempt $i/60 — deployment not found yet, waiting 5s..."
                sleep 5
              done

              oc rollout restart deployment/llamastack -n llamastack
              oc rollout status deployment/llamastack -n llamastack --timeout=300s
              echo "=== Done ==="
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
