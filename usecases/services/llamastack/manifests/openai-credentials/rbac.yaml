apiVersion: v1
kind: ServiceAccount
metadata:
  name: openai-patch-sa
  labels:
    app.kubernetes.io/name: openai-patch
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: llamastack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openai-patch-role
  labels:
    app.kubernetes.io/name: openai-patch
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: llamastack
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openai-patch-binding
  labels:
    app.kubernetes.io/name: openai-patch
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: llamastack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openai-patch-role
subjects:
  - kind: ServiceAccount
    name: openai-patch-sa
