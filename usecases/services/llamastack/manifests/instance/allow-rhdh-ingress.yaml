apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rhdh-to-llamastack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app: ogx
      app.kubernetes.io/instance: llamastack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rolling-demo-ns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagenti-system
      ports:
        - port: 8321
          protocol: TCP
