apiVersion: v1
kind: Secret
metadata:
  name: llama-stack-secret
  labels:
    app.kubernetes.io/name: llamastack
    app.kubernetes.io/component: config
    ogx.io/watch: "true"
  annotations:
    description: >-
      vLLM connection details for LlamaStack inference and embeddings.
      After deploy, patch with your values if needed:
        oc patch secret llama-stack-secret -n llamastack
          -p '{"stringData":{"VLLM_URL":"<url>","INFERENCE_MODEL":"<model>"}}'
type: Opaque
stringData:
  OPENAI_API_KEY: CHANGE_ME
  INFERENCE_MODEL: vllm-inference/gpt-4.1
  VLLM_URL: https://api.openai.com/v1
  VLLM_TLS_VERIFY: "true"
  VLLM_API_TOKEN: CHANGE_ME
  VLLM_MAX_TOKENS: "4096"
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_PROVIDER_MODEL_ID: text-embedding-3-small
  VLLM_EMBEDDING_URL: https://api.openai.com/v1
  VLLM_EMBEDDING_TLS_VERIFY: "true"
  VLLM_EMBEDDING_API_TOKEN: CHANGE_ME
  VLLM_EMBEDDING_MAX_TOKENS: "8192"
