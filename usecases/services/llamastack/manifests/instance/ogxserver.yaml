apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: llamastack
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  distribution:
    name: rh-dev
  overrideConfig:
    name: llamastack-custom-config
    key: config.yaml
  network:
    externalAccess:
      enabled: true
    policy:
      ingress:
        - from:
            - podSelector: {}
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: redhat-ods-applications
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: rolling-demo-ns
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kagenti-system
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: team1
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: team2
          ports:
            - port: 8321
              protocol: TCP
  workload:
    overrides:
      env:
        - name: POSTGRES_HOST
          value: postgres.llamastack.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: llamastack
        - name: POSTGRES_USER
          value: llamastack
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: INFERENCE_MODEL
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: INFERENCE_MODEL
        - name: VLLM_URL
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_URL
        - name: VLLM_TLS_VERIFY
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_TLS_VERIFY
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_API_TOKEN
        - name: VLLM_MAX_TOKENS
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_MAX_TOKENS
        - name: ENABLE_FAISS
          value: "faiss"
        - name: EMBEDDING_MODEL
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: EMBEDDING_MODEL
        - name: EMBEDDING_PROVIDER_MODEL_ID
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: EMBEDDING_PROVIDER_MODEL_ID
        - name: VLLM_EMBEDDING_URL
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_EMBEDDING_URL
        - name: VLLM_EMBEDDING_TLS_VERIFY
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_EMBEDDING_TLS_VERIFY
        - name: VLLM_EMBEDDING_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_EMBEDDING_API_TOKEN
        - name: VLLM_EMBEDDING_MAX_TOKENS
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: VLLM_EMBEDDING_MAX_TOKENS
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llama-stack-secret
              key: OPENAI_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: api_key
